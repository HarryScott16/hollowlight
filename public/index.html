<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hollowlight</title>
  <link rel="stylesheet" href="css/style.css">
  <script type="module" src="js/main.js"></script>
</head>
<body>
  <div id="app">
    <header id="hud">
      <div class="hud-stats">
        <span class="stat lives" title="Lives"><span class="glyph">&#9829;</span><b id="hud-lives">150</b></span>
        <span class="stat gold" title="Gold"><span class="glyph">&#9670;</span><b id="hud-gold">0</b></span>
        <span class="stat wave" title="Wave">Wave <b id="hud-wave">0</b></span>
      </div>
      <div class="hud-controls">
        <button id="btn-wave" class="primary" type="button">Start wave</button>
        <label class="auto" title="Start the next wave automatically when the field is clear"><input id="chk-auto" type="checkbox"> Auto</label>
        <span class="sep"></span>
        <button id="btn-pause" type="button" title="Pause (Space)">Pause</button>
        <span class="speed" role="group" aria-label="Game speed">
          <button type="button" data-speed="1" class="active">1x</button>
          <button type="button" data-speed="2">2x</button>
          <button type="button" data-speed="3">3x</button>
        </span>
        <span class="sep"></span>
        <button id="btn-restart" type="button" title="Restart (R)">Restart</button>
      </div>
    </header>
    <main>
      <div id="stage">
        <canvas id="game" width="1120" height="720"></canvas>
        <div id="overlay" hidden>
          <div class="overlay-card">
            <h1 id="overlay-title"></h1>
            <p id="overlay-text"></p>
            <div class="overlay-buttons">
              <button id="overlay-continue" class="primary" type="button" hidden>Continue into the endless night</button>
              <button id="overlay-restart" type="button">Play again</button>
            </div>
          </div>
        </div>
        <div id="paused-tag" hidden>Paused</div>
      </div>
      <aside id="side">
        <section id="abilities">
          <h2>Abilities <span class="hint" id="last-light" title="">Last Light ready</span></h2>
          <div id="ability-list"></div>
        </section>
        <section id="shop">
          <h2>Wards <span class="hint">click, then place on the map</span></h2>
          <div id="shop-list"></div>
          <p id="shop-info"></p>
        </section>
        <section id="tower-panel" hidden></section>
        <section id="preview">
          <h2 id="preview-title">Next wave</h2>
          <div id="preview-list"></div>
        </section>
      </aside>
    </main>
  </div>
</body>
</html>
